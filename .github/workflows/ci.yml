name: Continuous Integration
on:
  push:
  pull_request:
jobs:
  javabuild:
    name: Java build
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[twgit] Init') && github.ref != 'refs/heads/stable'"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build jars
        run: cd java-src && mvn package && cp target/cbjgroups-jar-with-dependencies.jar lib/cbjgroups.jar
      - name: Convert to bundle
        run: |
          cd java-src/artifacts && \
          unzip cbjgroups.jar && \
          echo "Manifest-Version: 1.0
          Bundle-ManifestVersion: 2
          Bundle-Name: CBJGroups Java Services
          Bundle-SymbolicName: org.pixl8.cbjgroups
          Bundle-Version: 1.0.0
          " > META-INF/MANIFEST.MF && \
          rm cbjgroups.jar && \
          zip -rq cbjgroups.jar * && \
          cp cbjgroups.jar ../../lib/
      - name: Upload Java Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cbjgroups-java-artifacts
          path: lib/*.jar

  runtests:
    name: Run test matrix
    needs: javabuild
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[twgit] Init') && github.ref != 'refs/heads/stable'"
    strategy:
      fail-fast: false
      matrix:
        include:
          - cfengine: "lucee@5.4"
            jdkVersion: "11"
            experimental: false
          - cfengine: "lucee@6.2"
            jdkVersion: "21"
            experimental: false
          - cfengine: "lucee@7.0"
            jdkVersion: "24"
            experimental: true
          - cfengine: "boxlang@stable"
            jdkVersion: "24"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Java Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cbjgroups-java-artifacts
          path: lib

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ matrix.jdkVersion }}

      - name: Setup CommandBox CLI
        uses: Ortus-Solutions/setup-commandbox@v2.0.1

      - name: Install dependencies
        run: box install --force --verbose

      - name: Start ${{ matrix.cfengine }} Server
        run: |
          # Startup the Server
          box server start directory="${GITHUB_WORKSPACE}/tests" serverConfigFile="${GITHUB_WORKSPACE}/tests/server-cbjgroupstests.json" cfengine="${{ matrix.cfengine }}" --noSaveSettings --debug
          # Test site build up
          curl http://127.0.0.1:6556

      - name: Run tests
        run: |
          mkdir -p tests/results
          exitcode=0
          box testbox run --verbose outputFile=tests/results/test-results outputFormats=json,antjunit

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbjgroups-test-results-${{ matrix.cfengine }}-jdk${{ matrix.jdkVersion }}
          path: |
            tests/results/*

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: tests/results/*.xml

  publish:
    name: Publish
    needs: runtests
    runs-on: ubuntu-latest
    if: "success() && github.event_name != 'pull_request' && ( startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release-' ) )"
    steps:
      - name: Setup flow variables
        run: |
          branch=${GITHUB_REF##*/}
          publish=false
          if [[ "{{ env.event.name }}" != "pull_request" ]] ; then
            if [[ $branch == release-* ]] || [[ $branch == v* ]] ; then
              publish=true
            fi
          fi
          echo "PUBLISH=$publish" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Java Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cbjgroups-java-artifacts
          path: lib

      - name: Generate release version number
        id: versiongen
        uses: pixl8/github-action-twgit-release-version-generator@v2

      - name: Inject version into box json
        uses: dominicwatson/github-action-envsubst@v1
        with:
          files: box.json
          patterns: $VERSION_NUMBER
        env:
          VERSION_NUMBER: ${{ steps.versiongen.outputs.semver_release_string }}

      - name: Zip project
        run: zip -rq $ZIP_FILE * --exclude=".*" --exclude="\.git/*" --exclude="\.github/*" --exclude="\docs/*" --exclude="\java-src/*" --exclude="\tests/*"
        shell: bash
        env:
          ZIP_FILE: ${{ steps.versiongen.outputs.semver_release_number }}.zip

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.versiongen.outputs.semver_release_string }}
          release_name: Release ${{ steps.versiongen.outputs.semver_release_string }}
          draft: false
          prerelease: ${{ steps.versiongen.outputs.semver_release_is_snapshot }}

      - name: Upload Release Asset
        id: upload
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ${{ steps.versiongen.outputs.semver_release_number }}.zip
          asset_name: ${{ steps.versiongen.outputs.semver_release_number }}.zip
          asset_content_type: application/zip

      - name: Inject download location
        uses: DominicWatson/github-action-envsubst@stable
        with:
          files: box.json
        env:
          DOWNLOAD_URL: ${{ steps.upload.outputs.browser_download_url }}

      - name: Publish to forgebox
        uses: pixl8/github-action-box-publish@v3
        with:
          forgebox_user: ${{ secrets.FORGEBOX_USER }}
          forgebox_pass: ${{ secrets.FORGEBOX_PASS }}